# golangci-lint configuration (v2 schema).
# Several linters are tuned to this codebase rather than left at defaults;
# each adjustment is commented so the rationale is auditable.
version: "2"
run:
  build-tags:
    - integration
  modules-download-mode: readonly
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - copyloopvar
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - unconvert
    - whitespace
  disable:
    - funlen       # Some workflow parsers are legitimately long
    - gocognit     # Overlaps gocyclo
    - godot        # Comment punctuation is not worth enforcing
    - lll          # Line length handled by gofmt
    - unparam      # Noisy: flags interface-shaped params and always-nil sentinels
    - wsl          # Whitespace style too strict
  settings:
    dupl:
      # Rule files share intentionally similar matcher scaffolding.
      threshold: 250
    errcheck:
      # Comma-ok assertions are handled at call sites; flagging every `v, _ :=`
      # is noise. Blank assignment stays on so real discards are visible.
      check-type-assertions: false
      check-blank: true
      exclude-functions:
        - (*github.com/fatih/color.Color).Printf
        - (*github.com/fatih/color.Color).Println
        # Pure predicates: only fail on programmer error, which tests catch.
        - regexp.MatchString
        - filepath.Match
        - fmt.Sscanf
    goconst:
      # Below this, shared string literals are clearer inline than as constants.
      min-len: 5
      min-occurrences: 8
    gocritic:
      # Focus on diagnostics and performance; style/experimental/opinionated
      # produce subjective churn.
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy        # Copying range values is deliberate for readability
        - ifElseChain         # A switch is not always clearer than explicit branches
        - sprintfQuotedString # Report strings intentionally use markdown backticks
    gocyclo:
      # Rule matchers and workflow parsers are naturally branchy.
      min-complexity: 30
    gosec:
      excludes:
        - G104
        - G304
      severity: medium
      confidence: medium
    govet:
      disable:
        - shadow         # Too many false positives
        - fieldalignment # Reordering fields hurts readability
      enable-all: true
    misspell:
      locale: US
    prealloc:
      # Short-lived CLI scans: range/for-loop slice growth is not worth the noise.
      simple: true
      range-loops: false
      for-loops: false
    revive:
      rules:
        - name: exported
          # Doc-comment formatting churn adds no signal.
          arguments:
            - checkPrivateReceivers
          disabled: true
        - name: var-naming
          arguments:
            - - ID
              - URL
              - API
              - CI
              - CD
              - AST
              - AI
              - OSV
              - SARIF
              - YAML
              - JSON
          disabled: false
        - name: indent-error-flow
          disabled: false
        - name: errorf
          disabled: false
        - name: error-naming
          disabled: false
        - name: error-strings
          disabled: false
        - name: receiver-naming
          disabled: false
        - name: increment-decrement
          disabled: false
        - name: error-return
          disabled: false
        - name: unexported-return
          disabled: false
        - name: time-naming
          disabled: false
        - name: context-keys-type
          disabled: false
        - name: context-as-argument
          disabled: false
  exclusions:
    generated: lax
    rules:
      # Test files are exempt from these (fixtures favour clarity over lint rules).
      - linters:
          - dupl
          - errcheck
          - goconst
          - gosec
        path: _test\.go
      # Test fixtures deliberately populate fields the assertion never reads.
      - linters:
          - govet
        path: _test\.go
        text: unusedwrite
      # LLM provider clients intentionally mirror each other's request/response shape.
      - linters:
          - dupl
        path: pkg/ai/
      # Large rule matchers exercised by dedicated unit tests.
      - linters:
          - gocyclo
        text: CheckAIAgentCommentTriggered|checkDockerExecWithSecrets|checkAIAgentOnUntrustedCode
      # OPA v0 compatibility package; migration to opa/v1 tracked separately.
      - linters:
          - staticcheck
        text: open-policy-agent/opa/rego
      # QF* are editor quickfix suggestions, not correctness findings.
      - linters:
          - staticcheck
        text: "^QF[0-9]+:"
      # ST1005 flags intentional branded error strings ("Grok API error: ...").
      - linters:
          - staticcheck
        text: "^ST1005:"
      - linters:
          - all
        path: .*\.pb\.go
      - linters:
          - all
        path: vendor/
      - linters:
          - godox
        text: TODO
      - linters:
          - lll
        source: '^//go:generate '
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked
      - path: (.+)\.go$
        text: 'G304: Potential file inclusion via variable'
      - path: (.+)\.go$
        text: 'G306: Expect WriteFile permissions to be 0600 or less'
    paths:
      - vendor
      - test/testdata
      - examples
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
severity:
  default: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - errcheck
      severity: error
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/harekrishnarai/flowlyt
  exclusions:
    generated: lax
    paths:
      - vendor
      - test/testdata
      - examples
      - third_party$
      - builtin$
      - examples$
