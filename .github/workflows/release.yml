name: Release

on:
  push:
    tags:
      - 'v*'

# Minimal permissions at workflow level
permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write  # Needed for creating releases
      id-token: write  # For cosign signing
      attestations: write  # For provenance attestations

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Run tests before release
        run: go test -v ./pkg/config ./pkg/parser ./pkg/policies ./pkg/rules ./pkg/shell

      - name: Run full test suite
        run: go test ./... -v -race -timeout=5m

      - name: Build binaries
        id: build
        run: |
          # Build for multiple platforms with security flags
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            output="flowlyt-${os}-${arch}"

            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi

            echo "Building ${output}..."
            GOOS=$os GOARCH=$arch go build \
              -trimpath \
              -ldflags="-s -w -X github.com/harekrishnarai/flowlyt/pkg/constants.AppVersion=${GITHUB_REF_NAME#v}" \
              -o "$output" \
              ./cmd/flowlyt
          done

          # Create checksums
          sha256sum flowlyt-* > checksums.txt

          # Display checksums
          echo "=== Checksums ==="
          cat checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binaries with Cosign
        run: |
          for file in flowlyt-*; do
            if [ "$file" != "checksums.txt" ]; then
              echo "Signing ${file}..."
              cosign sign-blob --yes \
                --output-signature="${file}.sig" \
                --output-certificate="${file}.pem" \
                "${file}"
            fi
          done

      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'flowlyt-*'

      # Release notes come from CHANGELOG.md so the published description matches
      # what is committed. Relying on generate_release_notes alone produced a
      # PR-title list, and an existing release body would be preserved verbatim
      # -- which is how v2.1.0 first shipped with stale, unrelated notes.
      - name: Build release notes from CHANGELOG
        env:
          # The tag is passed through the environment rather than interpolated
          # into the script. A ${{ }} expression is substituted into the script
          # text before the shell parses it, so a crafted tag name would be
          # executed as code; an environment variable is only ever data.
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail

          # Reject anything that is not a plain semver tag before it is used.
          # The value reaches an awk regex and the notes body, so unvalidated
          # input could alter which section is selected or inject content into
          # the published release.
          #
          # Matched with bash's [[ =~ ]] rather than grep: grep evaluates input
          # line by line, so a tag containing a newline would pass on its first
          # line while carrying arbitrary text after it.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing to build release notes for malformed tag"
            exit 1
          fi

          version="${TAG#v}"

          # ver is a literal version string, validated above, so it cannot carry
          # regex metacharacters into this match.
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::warning::No CHANGELOG.md section for ${version}; linking to the changelog instead."
            printf 'See the [changelog](https://github.com/%s/blob/%s/CHANGELOG.md) for details.\n' \
              "$GITHUB_REPOSITORY" "$TAG" > "$NOTES_FILE"
          fi

          echo "Release notes for ${TAG}: $(wc -l < "$NOTES_FILE") lines"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          # Replace any pre-existing body rather than preserving it.
          append_body: false
          files: |
            flowlyt-linux-amd64
            flowlyt-linux-amd64.sig
            flowlyt-linux-amd64.pem
            flowlyt-linux-arm64
            flowlyt-linux-arm64.sig
            flowlyt-linux-arm64.pem
            flowlyt-darwin-amd64
            flowlyt-darwin-amd64.sig
            flowlyt-darwin-amd64.pem
            flowlyt-darwin-arm64
            flowlyt-darwin-arm64.sig
            flowlyt-darwin-arm64.pem
            flowlyt-windows-amd64.exe
            flowlyt-windows-amd64.exe.sig
            flowlyt-windows-amd64.exe.pem
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: harekrishnarai/homebrew-flowlyt
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret not set — skipping Homebrew formula publish."
            echo "To enable: create the '${TAP_REPO}' repo and add a HOMEBREW_TAP_TOKEN secret (PAT with contents:write on that repo)."
            exit 0
          fi
          version="${VERSION#v}"
          sha() { awk -v f="$1" '$2==f {print $1}' checksums.txt; }
          darwin_arm="$(sha flowlyt-darwin-arm64)"
          darwin_amd="$(sha flowlyt-darwin-amd64)"
          linux_arm="$(sha flowlyt-linux-arm64)"
          linux_amd="$(sha flowlyt-linux-amd64)"
          base="https://github.com/harekrishnarai/flowlyt/releases/download/${VERSION}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
          mkdir -p tap-repo/Formula
          cat > tap-repo/Formula/flowlyt.rb <<RUBY
          class Flowlyt < Formula
            desc "Multi-Platform CI/CD Security Analyzer"
            homepage "https://github.com/harekrishnarai/flowlyt"
            version "${version}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "${base}/flowlyt-darwin-arm64"
                sha256 "${darwin_arm}"
              end
              on_intel do
                url "${base}/flowlyt-darwin-amd64"
                sha256 "${darwin_amd}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/flowlyt-linux-arm64"
                sha256 "${linux_arm}"
              end
              on_intel do
                url "${base}/flowlyt-linux-amd64"
                sha256 "${linux_amd}"
              end
            end

            def install
              bin.install Dir["flowlyt-*"].first => "flowlyt"
            end

            test do
              assert_match "flowlyt version", shell_output("#{bin}/flowlyt --version")
            end
          end
          RUBY

          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flowlyt.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "flowlyt ${version}"
            git push
            echo "Published Homebrew formula for ${version} to ${TAP_REPO}."
          fi

      - name: Display release information
        run: |
          echo "✅ Release created successfully!"
          echo "Version: ${GITHUB_REF_NAME}"
          echo "All binaries signed with Cosign"
          echo "Checksums available in checksums.txt"
